<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>VolleyStat iPad</title>
<style>
:root{--bg:#07111e;--panel:#102239;--line:#2b4058;--text:#eef5ff;--muted:#9db0c6;--green:#38d6a4;--red:#ef5961;--blue:#18314f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}button{cursor:pointer;border:0;color:var(--text)}
header{position:sticky;top:0;z-index:20;background:#0b1726;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:12px}
.brand{font-size:20px;font-weight:900;margin-right:auto}.topbtn{padding:10px 16px;border-radius:10px;background:#17304b;font-weight:900}.reset{background:var(--red)!important}
nav{display:flex;background:#0b1726;border-bottom:1px solid var(--line);position:sticky;top:61px;z-index:19}
nav button{flex:1;padding:15px 12px;background:transparent;border-right:1px solid var(--line);font-weight:900;color:#9eb1c7}
nav button.active{background:var(--blue);color:#fff}
main{padding:14px;max-width:1800px;margin:auto}.screen{display:none}.screen.active{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.title{display:flex;align-items:center;justify-content:space-between;gap:12px}.title h2{margin:0}
.teamname{width:280px;padding:9px;border-radius:9px;border:1px solid var(--line);background:#091725;color:white}
.skills{display:flex;gap:8px;overflow:auto;margin-bottom:12px}
.skills button{white-space:nowrap;padding:11px 18px;border-radius:9px;background:#203954;font-weight:900}
.skills button.active{background:var(--green);color:#062018}
.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
.stats{width:100%;min-width:1250px;border-collapse:collapse}.stats th,.stats td{border-bottom:1px solid var(--line);padding:5px;text-align:center}
.stats th{background:#152c46;position:sticky;top:0;z-index:2}.stats th:first-child,.stats td:first-child{position:sticky;left:0;z-index:3;text-align:left;background:#102239}
.stats th:first-child{background:#152c46}.playerName{width:155px;padding:7px;border-radius:7px;border:1px solid var(--line);background:#091725;color:white}
.total,.teamrow{font-weight:900}.teamrow td{background:#17314a!important}.ef{color:#dfe7ef}.pos{color:var(--green)}.err{color:#ff737a}
.actions{display:flex;align-items:center;justify-content:center;gap:4px}.actions button{width:28px;height:28px;border-radius:6px;background:#203954;font-weight:900}
.actions button.plus{background:#17614e}.actions button.minus{background:#613039}.count{min-width:24px;font-weight:900}
.help{color:var(--muted);font-size:12px;margin:10px 2px 0}
.charts{display:grid;grid-template-columns:1fr;gap:14px}.chart{background:#0d1d2f;border:1px solid var(--line);border-radius:12px;padding:14px}
.chart h2{text-align:center;color:#ffd64f;margin:0 0 12px}.legend{text-align:center;color:#cbd6e3;font-weight:800;margin-bottom:6px}
.legend span{margin:0 8px}.legend .w{color:#dfe7ef}.legend .g{color:#2ed39d}.legend .r{color:#ed5b62}
.bars{display:grid;grid-template-columns:repeat(14,minmax(65px,1fr));gap:8px;align-items:end;height:280px;border-bottom:1px solid #617187;padding:10px 4px 0}
.barcol{height:100%;display:flex;align-items:end;justify-content:center;gap:2px}.bar{width:12px;border-radius:4px 4px 0 0;min-height:1px}
.bar.ef{background:#dfe7ef}.bar.pos{background:#2ed39d}.bar.err{background:#ed5b62}
.xlabel{font-size:10px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}
.teamCharts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.teamChart{background:#0d1d2f;border:1px solid var(--line);border-radius:12px;padding:14px}
.teamChart h2{text-align:center;color:#ffd64f;margin:0 0 18px}.bigbars{height:330px;display:flex;align-items:end;justify-content:center;gap:18px;border-bottom:1px solid #617187}
.bigcol{width:24%;display:flex;align-items:end;justify-content:center}.bigbar{width:100%;max-width:95px;border-radius:7px 7px 0 0;position:relative}
.bigbar span{position:absolute;top:-24px;left:0;right:0;text-align:center;font-weight:900}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.metric{background:#152c46;border-radius:10px;padding:12px;text-align:center}.metric b{font-size:20px}.small{font-size:11px;color:var(--muted)}
@media(max-width:900px){.teamCharts{grid-template-columns:1fr}.bars{grid-template-columns:repeat(14,minmax(55px,1fr))}.teamname{width:220px}}
</style>
</head>
<body>
<header>
<div class="brand">🏐 VolleyStat</div>
<input id="teamName" class="teamname" value="Club Italia" onchange="save()">
<button class="topbtn reset" onclick="resetAll()">RESET</button>
</header>
<nav>
<button class="active" onclick="show('data',this)">DATOS</button>
<button onclick="show('players',this)">GRÁFICOS JUGADORES</button>
<button onclick="show('team',this)">GRÁFICO EQUIPO</button>
</nav>
<main>
<section id="data" class="screen active">
<div class="card"><div class="title"><h2>📊 Estadística — <span id="skillTitle">Saque</span></h2><div class="small">14 jugadores · + suma · − resta</div></div></div>
<div class="card">
<div class="skills" id="skills"></div>
<div class="tableWrap"><table class="stats" id="statTable"></table></div>
<div class="help">Puedes corregir cualquier anotación en el momento: pulsa − para quitar una bola y + para agregarla.</div>
</div>
</section>

<section id="players" class="screen">
<div class="card"><div class="title"><h2>GRÁFICOS JUGADORES</h2><div class="small">Los 14 jugadores · Ef · Pos % · Err</div></div>
<div class="skills" id="chartSkills"></div></div>
<div class="charts" id="playerCharts"></div>
</section>

<section id="team" class="screen">
<div class="card"><div class="title"><h2>GRÁFICO EQUIPO</h2><div class="small">Total del equipo</div></div></div>
<div class="teamCharts" id="teamCharts"></div>
</section>
</main>

<script>
const skills=['Saque','Recepción','Ataque'];
const defs={
'Saque':[['=','Error'],['-','Neutro'],['+','Neutro'],['/','Neutro'],['!','Pos'],['#','Pos']],
'Recepción':[['=','Error'],['/','Error'],['-','Neutro'],['!','Neutro'],['+','Pos'],['#','Pos']],
'Ataque':[['=','Error'],['/','Error'],['-','Neutro'],['+','Neutro'],['#','Pos']]
};

let state=JSON.parse(localStorage.getItem('volleystat_ipad')||'null');
if(!state)state={skill:'Saque',name:'Club Italia',players:[]};

function blank(i){
 let stats={};
 skills.forEach(k=>{stats[k]={};defs[k].forEach(x=>stats[k][x[0]]=0)});
 return{name:'JUGADOR '+(i+1),stats};
}
while(state.players.length<14)state.players.push(blank(state.players.length));
if(!state.skill)state.skill='Saque';

function save(){
 state.name=document.getElementById('teamName').value||'Club Italia';
 localStorage.setItem('volleystat_ipad',JSON.stringify(state));render();
}
function clamp(n){return Math.max(0,Math.min(100,n))}
function calc(p,k){
 let s=p.stats[k],total=0,pos=0,err=0;
 defs[k].forEach(([sym,type])=>{
   total+=s[sym]||0;
   if(type==='Pos')pos+=s[sym]||0;
   if(type==='Error')err+=s[sym]||0;
 });
 let ef=total?(pos-err)/total*100:0;
 return{total,pos,err,ef,posPct:total?pos/total*100:0,errPct:total?err/total*100:0,s};
}
function agg(k){
 let a={};defs[k].forEach(x=>a[x[0]]=0);
 state.players.forEach(p=>defs[k].forEach(x=>a[x[0]]+=(p.stats[k][x[0]]||0)));
 return calc({stats:{[k]:a}},k);
}
function change(i,sym,delta){
 let v=state.players[i].stats[state.skill][sym]||0;
 state.players[i].stats[state.skill][sym]=Math.max(0,v+delta);
 localStorage.setItem('volleystat_ipad',JSON.stringify(state));render();
}
function resetAll(){
 if(confirm('¿RESET? Se borrará toda la estadística.')){
   state={skill:'Saque',name:'Club Italia',players:[]};
   while(state.players.length<14)state.players.push(blank(state.players.length));
   localStorage.setItem('volleystat_ipad',JSON.stringify(state));render();
 }
}
function show(id,btn){
 document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
 btn.classList.add('active');render();
}
function setSkill(k){state.skill=k;localStorage.setItem('volleystat_ipad',JSON.stringify(state));render()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){
 document.getElementById('teamName').value=state.name||'Club Italia';
 renderSkills();renderTable();renderPlayerCharts();renderTeamCharts();
}
function renderSkills(){
 let h=skills.map(k=>`<button class="${k===state.skill?'active':''}" onclick="setSkill('${k}')">${k}</button>`).join('');
 document.getElementById('skills').innerHTML=h;
 document.getElementById('chartSkills').innerHTML=h;
 document.getElementById('skillTitle').textContent=state.skill;
}
function actionCell(i,sym){
 let n=state.players[i].stats[state.skill][sym]||0;
 return`<div class="actions"><button class="minus" onclick="change(${i},'${sym}',-1)">−</button><span class="count">${n}</span><button class="plus" onclick="change(${i},'${sym}',1)">+</button></div>`;
}
function renderTable(){
 let d=defs[state.skill];
 let head=d.map(x=>`<th>${x[0]}</th>`).join('');
 let rows=state.players.map((p,i)=>{
   let c=calc(p,state.skill);
   return`<tr><td><input class="playerName" value="${esc(p.name)}" onchange="state.players[${i}].name=this.value;save()"></td>
   ${d.map(x=>`<td>${actionCell(i,x[0])}</td>`).join('')}
   <td class="total">${c.total}</td><td class="ef">${c.ef.toFixed(0)}%</td><td class="pos">${c.posPct.toFixed(0)}%</td><td class="err">${c.errPct.toFixed(0)}%</td></tr>`;
 }).join('');
 let c=agg(state.skill);
 document.getElementById('statTable').innerHTML=
 `<thead><tr><th>JUGADORES</th>${head}<th>T</th><th>Ef</th><th>Pos %</th><th>Err</th></tr></thead>
 <tbody>${rows}<tr class="teamrow"><td>EQUIPO</td>${d.map(x=>`<td>${c.s[x[0]]}</td>`).join('')}
 <td>${c.total}</td><td class="ef">${c.ef.toFixed(0)}%</td><td class="pos">${c.posPct.toFixed(0)}%</td><td class="err">${c.errPct.toFixed(0)}%</td></tr></tbody>`;
}
function playerChart(k){
 let cols=state.players.map((p,i)=>{
   let c=calc(p,k);
   return`<div><div class="barcol">
   <div class="bar ef" style="height:${clamp(c.ef)*2.4}px"></div>
   <div class="bar pos" style="height:${clamp(c.posPct)*2.4}px"></div>
   <div class="bar err" style="height:${clamp(c.errPct)*2.4}px"></div>
   </div><div class="xlabel">${i+1}</div></div>`;
 }).join('');
 return`<div class="chart"><h2>${k}</h2>
 <div class="legend"><span class="w">■ Ef</span><span class="g">■ Pos %</span><span class="r">■ Err</span></div>
 <div class="bars">${cols}</div>
 <div class="xlabel" style="margin-top:8px">${state.players.map((p,i)=>`<span style="display:inline-block;width:${100/14}%">${esc(p.name)}</span>`).join('')}</div>
 </div>`;
}
function renderPlayerCharts(){document.getElementById('playerCharts').innerHTML=skills.map(playerChart).join('')}
function teamChart(k){
 let c=agg(k);
 return`<div class="teamChart"><h2>${k}</h2>
 <div class="legend"><span class="w">■ Ef</span><span class="g">■ Pos %</span><span class="r">■ Err</span></div>
 <div class="bigbars">
 <div class="bigcol"><div class="bigbar" style="height:${clamp(c.ef)*2.8}px;background:#dfe7ef;color:#182333"><span>${c.ef.toFixed(0)}%</span></div></div>
 <div class="bigcol"><div class="bigbar" style="height:${clamp(c.posPct)*2.8}px;background:#2ed39d;color:#062018"><span>${c.posPct.toFixed(0)}%</span></div></div>
 <div class="bigcol"><div class="bigbar" style="height:${clamp(c.errPct)*2.8}px;background:#ed5b62"><span>${c.errPct.toFixed(0)}%</span></div></div>
 </div>
 <div class="summary"><div class="metric">T<br><b>${c.total}</b></div><div class="metric">Pos<br><b>${c.pos}</b></div><div class="metric">Err<br><b>${c.err}</b></div></div>
 </div>`;
}
function renderTeamCharts(){document.getElementById('teamCharts').innerHTML=skills.map(teamChart).join('')}
render();
</script>
</body>
</html>
