<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>VolleyStat</title>
<style>
:root{--bg:#f5f7fa;--panel:#fff;--line:#d9dee7;--blue:#1769c2;--blue2:#eaf3ff;--yellow:#f7bd18;--red:#ef3340;--orange:#f28a00;--green:#7dbb22;--darkgreen:#31951b;--text:#17202a;--muted:#687386}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,select{font:inherit}button{touch-action:manipulation}
header{background:#fff;border-bottom:1px solid var(--line);min-height:82px;display:flex;align-items:center;gap:22px;padding:12px 28px;box-shadow:0 1px 4px #0000000b}.logo{font-size:30px;font-weight:900;letter-spacing:-1px;margin-right:auto}.logo span{color:#f2b900}.tabs{display:flex;gap:8px}.tab{height:54px;min-width:190px;padding:0 25px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:18px;font-weight:900;color:#202630}.tab.active{background:var(--yellow);border-color:var(--yellow)}.headActions{display:flex;gap:10px}.action{height:50px;padding:0 20px;border-radius:9px;background:#fff;font-weight:900}.reset{border:1px solid #1674d1;color:#1674d1}.save{border:1px solid #28a936;color:#24942e}
main{max-width:1380px;margin:auto;padding:18px 28px 28px}.entry{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px 20px 18px}.entryTop{display:flex;align-items:center;justify-content:center;gap:18px}.esbox{display:flex;align-items:center;gap:12px;margin-right:18px}.circle{width:70px;height:70px;border:3px solid #1674d1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:900;background:#fff}.esText{font-size:13px;line-height:1.25;font-weight:900;text-transform:uppercase}.esText b{display:block;color:#1674d1;font-size:29px;margin-top:3px}
.ratings{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.vbtn{width:145px;height:112px;border:0;border-radius:12px;color:#fff;font-size:48px;font-weight:900;position:relative;box-shadow:0 2px 5px #0002}.vbtn .count{position:absolute;right:10px;bottom:7px;font-size:18px}.eq{background:#ef303b}.neg,.slash,.exc{background:#f28a00}.pos{background:#8abb20}.dblpos{background:#31951b}
.playersWrap{margin-top:18px}.playersTitle{text-align:center;font-weight:900;font-size:14px;color:var(--muted);margin-bottom:8px}.players{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.playerBtn{min-width:135px;height:52px;padding:0 16px;border:1px solid #bfc7d3;border-radius:10px;background:#fff;color:#1769c2;font-weight:900}.playerBtn.active{background:var(--blue2);border:2px solid #1769c2}.addBtn{height:52px;padding:0 18px;border:2px dashed #1769c2;border-radius:10px;background:#fff;color:#1769c2;font-weight:900}
.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
.stats{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.stats table{width:100%;border-collapse:collapse;table-layout:fixed}.stats th,.stats td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:58px;text-align:center}.stats th:last-child,.stats td:last-child{border-right:0}.stats th{font-size:15px;font-weight:900}.stats th span{display:block;font-size:17px;margin-top:2px}.sum{color:#e5ad00}.pcol{color:#5c9d10}.ncol{color:#e72e38}.stats td{font-size:17px;font-weight:700}.playerCell{text-align:left!important;padding-left:18px}.badge{display:inline-flex;width:30px;height:30px;border-radius:50%;background:#1769c2;color:#fff;align-items:center;justify-content:center;margin-right:9px;font-size:13px}.eff{color:#e98900}.positive{color:#63a614}.negative{color:#e72e38}.team td{background:#f1f6fc;font-weight:900}
.bottom{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:14px;min-height:88px;display:flex;align-items:center;padding:10px 16px}.group{height:62px;padding:0 24px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}.group:first-child{padding-left:10px}.label{font-size:13px;color:var(--muted);font-weight:800;margin-bottom:3px}.value{font-size:25px;font-weight:900}.yellow{color:#e2ad00}.blue{color:#1769c2}.teamSelect{height:43px;border:1px solid #bfc7d3;border-radius:8px;background:#fff;color:#1769c2;font-size:19px;font-weight:900;padding:0 28px 0 12px}.clear{margin-left:auto;height:54px;padding:0 22px;border:1px solid #e52d35;border-radius:9px;background:#fff;color:#e52d35;font-weight:900}
@media(max-width:900px){header{padding:10px 12px;flex-wrap:wrap}.logo{width:100%;font-size:26px}.tabs{order:2;flex:1}.tab{min-width:0;flex:1}.headActions{order:3}.action{padding:0 12px}main{padding:12px}.entryTop{flex-direction:column}.esbox{margin:0}.vbtn{width:110px;height:95px;font-size:40px}.players{gap:6px}.playerBtn,.addBtn{min-width:115px}.bottom{flex-wrap:wrap;gap:8px}.group{padding:0 12px}.clear{margin-left:0}}
</style>
</head>
<body>
<header>
 <div class="logo">VOLLEY<span>STAT</span></div>
 <div class="tabs"><button id="recTab" class="tab active" onclick="setFund('rec')">◉ &nbsp; RECEPCIÓN</button><button id="atqTab" class="tab" onclick="setFund('atq')">↗ &nbsp; ATAQUE</button></div>
 <div class="headActions"><button class="action reset" onclick="resetCurrent()">↻ &nbsp; RESET</button><button class="action save" onclick="saveAll()">▣ &nbsp; GUARDAR</button></div>
</header>
<main>
 <section class="entry">
  <div class="entryTop">
   <div class="esbox"><button class="circle" onclick="errorSaque()">E.S.</button><div class="esText">ERROR DE<br>SAQUE<b id="es">0</b></div></div>
   <div id="ratings" class="ratings"></div>
  </div>
  <div class="playersWrap">
   <div class="playersTitle">SELECCIONA LA JUGADORA Y REGISTRA LA VALORACIÓN</div>
   <div id="players" class="players"></div>
   <div class="hint">La valoración que pulses se suma a la jugadora seleccionada.</div>
  </div>
 </section>
 <section class="stats"><table><thead><tr><th>JUGADORA</th><th>TOTAL<br><span class="sum">Σ</span></th><th id="metric">EFICIENCIA<br><span class="sum">%</span></th><th class="pcol">POSITIVO<br><span>(+)</span></th><th class="ncol">NEGATIVO<br><span>(−)</span></th></tr></thead><tbody id="body"></tbody></table></section>
 <div class="bottom">
  <div class="group"><div class="label">SET</div><div class="value yellow">1</div></div>
  <div class="group"><div class="label">EQUIPO</div><select id="teamSelect" class="teamSelect" onchange="setTeam(this.value)"><option value="A">Equipo A</option><option value="B">Equipo B</option></select></div>
  <button class="clear" onclick="resetCurrent()">⌫ &nbsp; LIMPIAR DATOS</button>
 </div>
</main>
<script>
const symbols=['=','−','/','!','+','#'];
const classes=['eq','neg','slash','exc','pos','dblpos'];
let fund='rec',team='A',selected=0;
function blank(){return {name:'',v:[0,0,0,0,0,0]}}
function make(){return {players:[blank()],es:0}}
let DB=load();
function load(){try{const x=JSON.parse(localStorage.getItem('volleystat_white_dynamic'));if(x&&x.rec&&x.atq)return x}catch(e){}return {rec:{A:make(),B:make()},atq:{A:make(),B:make()}}}
function cur(){return DB[fund][team]}
function setFund(f){fund=f;selected=0;recTab.classList.toggle('active',f==='rec');atqTab.classList.toggle('active',f==='atq');render()}
function setTeam(t){team=t;selected=0;render()}
function selectPlayer(i){selected=i;render()}
function add(k){cur().players[selected].v[k]++;render()}
function errorSaque(){cur().es++;render()}
function addPlayer(){cur().players.push(blank());selected=cur().players.length-1;render()}
function resetCurrent(){if(confirm('¿Quieres borrar los datos de '+(team==='A'?'Equipo A':'Equipo B')+' en '+(fund==='rec'?'Recepción':'Ataque')+'?')){DB[fund][team]=make();selected=0;render()}}
function saveAll(){localStorage.setItem('volleystat_white_dynamic',JSON.stringify(DB));alert('Datos guardados.')}
function calc(p){let t=p.v.reduce((a,b)=>a+b,0),pos=fund==='rec'?p.v[4]+p.v[5]:p.v[5],neg=p.v[0]+p.v[2],val=t?((fund==='rec'?pos-neg:pos)/t*100):0;return[t,pos,neg,val]}
function render(){
 const c=cur();document.getElementById('es').textContent=c.es;
 const r=document.getElementById('ratings');r.innerHTML='';symbols.forEach((s,k)=>{const b=document.createElement('button');b.className='vbtn '+classes[k];b.innerHTML=s+'<span class="count">'+c.players[selected].v[k]+'</span>';b.onclick=()=>add(k);r.appendChild(b)});
 const pwrap=document.getElementById('players');pwrap.innerHTML='';c.players.forEach((p,i)=>{const b=document.createElement('button');b.className='playerBtn'+(i===selected?' active':'');b.textContent=p.name||'Jugadora '+(i+1);b.onclick=()=>selectPlayer(i);pwrap.appendChild(b)});const a=document.createElement('button');a.className='addBtn';a.textContent='+ AGREGAR JUGADORA';a.onclick=addPlayer;pwrap.appendChild(a);
 document.getElementById('metric').innerHTML=fund==='rec'?'EFICIENCIA<br><span class="sum">%</span>':'EFICACIA<br><span class="sum">%</span>';
 let html='',T=[0,0,0];c.players.forEach((p,i)=>{let [t,pos,neg,val]=calc(p);T[0]+=t;T[1]+=pos;T[2]+=neg;html+=`<tr><td class="playerCell"><span class="badge">${i+1}</span>${p.name||'Jugadora '+(i+1)}</td><td>${t}</td><td class="eff">${val.toFixed(0)}%</td><td class="positive">${pos}</td><td class="negative">${neg}</td></tr>`});let tv=T[0]?((fund==='rec'?T[1]-T[2]:T[1])/T[0]*100):0;html+=`<tr class="team"><td class="playerCell">TOTAL DEL EQUIPO</td><td>${T[0]}</td><td class="eff">${tv.toFixed(0)}%</td><td class="positive">${T[1]}</td><td class="negative">${T[2]}</td></tr>`;document.getElementById('body').innerHTML=html;
 document.getElementById('teamSelect').value=team;
}
render();
</script>
</body></html>
