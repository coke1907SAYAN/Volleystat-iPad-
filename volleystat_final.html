<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>VolleyStat</title>
<style>
:root{--navy:#071a3a;--blue:#1677c8;--light:#eef6ff;--pink:#fff0f5;--pink2:#ffdce8;--green:#16734b;--red:#c93645;--orange:#ee9b22;--yellow:#f2c94c;--ink:#12213a;--line:#cbd6e3;--muted:#65758b}*{box-sizing:border-box}html,body{margin:0;background:#f4f7fb;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{touch-action:manipulation}.app{min-height:100vh}.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px #0003}.bar{height:60px;display:flex;align-items:center;gap:14px;padding:8px 14px}.logo{font-weight:900;font-size:23px;letter-spacing:.4px;white-space:nowrap}.logo span{color:#ffd84d}.tabs{display:flex;gap:6px;overflow:auto;flex:1}.tabs button{border:0;background:#19345f;color:#dbe7f8;border-radius:9px;padding:10px 13px;font-weight:800;white-space:nowrap}.tabs button.active{background:#fff;color:var(--navy)}.setbox{display:flex;align-items:center;gap:5px;white-space:nowrap}.setbox select{border:0;border-radius:8px;padding:8px;font-weight:800}.icon{background:#19345f;color:#fff;border:0;border-radius:8px;width:38px;height:38px;font-size:19px}.wrap{max-width:1500px;margin:auto;padding:12px}.screen{display:none}.screen.active{display:block}.panel{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;background:#fff;box-shadow:0 1px 2px #0000000d}.panel h2{font-size:15px;margin:0;padding:9px 12px;letter-spacing:.4px}.servePanel h2{background:var(--pink2)}.recPanel h2{background:#cfe9ff}.roster{padding:9px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.recRoster{grid-template-columns:repeat(5,minmax(0,1fr))}.player{border:1px solid #d2dbe7;border-radius:10px;background:#fff;padding:7px;min-width:0}.playerHead{display:flex;align-items:center;gap:5px}.player input{width:100%;border:0;outline:0;font-weight:800;font-size:13px;min-width:0;background:transparent}.count{font-size:12px;font-weight:900;color:#49617d;background:#edf3fa;border-radius:999px;padding:3px 6px;flex:0 0 auto}.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}.zones button{border:1px solid #b9c6d5;background:#f6f9fc;border-radius:7px;padding:7px 0;font-weight:900;color:#29425f}.player.selected{outline:3px solid #0c73c8;outline-offset:1px}.zones button.sel{background:#0d76c9;color:#fff;border-color:#0d76c9}.valuation{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:10px}.val{height:56px;border:0;border-radius:10px;color:#fff;font-size:28px;font-weight:900}.v-eq,.v-sl{background:var(--red)}.v-dash{background:var(--orange)}.v-bang{background:var(--yellow);color:#222}.v-plus{background:#42a85f}.v-hash{background:#12683f}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;border-top:1px solid var(--line)}.actions button{border:0;border-radius:9px;padding:12px;font-weight:900}.quick{background:#eaf3ff}.undo{background:#f3f5f8}.current{margin:0 10px 10px;background:#071a3a;color:#fff;border-radius:9px;padding:11px 13px;font-weight:900;min-height:42px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.counter{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}.counter .box{background:#f5f8fc;border:1px solid var(--line);border-radius:9px;padding:8px;text-align:center}.box b{display:block;font-size:23px}.box span{font-size:11px;color:var(--muted);font-weight:800}.analysis{overflow-x:auto}.analysis h1{font-size:20px;margin:8px 2px 10px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:14px}.tbl{border-collapse:collapse;width:100%;font-size:11px;min-width:980px}.tbl th,.tbl td{border:1px solid #d5dde7;padding:5px 6px;text-align:center;white-space:nowrap}.tbl th{background:#edf3fa;font-weight:900}.tbl td:first-child,.tbl td:nth-child(2){text-align:left}.sectionTitle{font-size:15px;font-weight:900;margin:14px 2px 7px}.detail{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}.detailHead{display:flex;justify-content:space-between;align-items:center;background:#edf3fa;padding:8px 10px;font-weight:900}.detailHead small{color:#4b617a}.detail .tbl{min-width:780px}.pill{display:inline-block;padding:3px 6px;border-radius:6px;font-weight:900}.p-e{background:#ffe3e6}.p-n{background:#fff0d5}.p-a{background:#dcf5e6}.empty{padding:20px;text-align:center;color:var(--muted)}.newmatch{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap}.newmatch input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:8px;padding:10px}.newmatch button{border:0;border-radius:8px;padding:10px 14px;font-weight:900;background:var(--navy);color:#fff}.note{font-size:11px;color:var(--muted);padding:0 2px 8px}.zoneSummary td:first-child{text-align:center}.no-print{display:block}@media(max-width:900px){.bar{height:auto;min-height:58px;flex-wrap:wrap}.tabs{order:3;flex-basis:100%;padding-bottom:2px}.roster{grid-template-columns:repeat(7,minmax(100px,1fr));overflow:hidden}.recRoster{grid-template-columns:repeat(5,minmax(110px,1fr))}.panel{border-radius:9px}.wrap{padding:8px}.tbl{font-size:10px}.valuation{gap:5px}.val{height:52px}.actions{grid-template-columns:1fr 1fr}}
@media(min-width:901px){.wrap{padding:16px}.panel{margin-bottom:14px}.roster{gap:9px}.player{padding:8px}.player input{font-size:14px}.val{height:62px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="bar"><div class="logo">Volley<span>Stat</span></div><nav class="tabs"><button data-screen="reg" class="active">REGISTRO</button><button data-screen="rec">ANÁLISIS RECEPCIÓN</button><button data-screen="srv">ANÁLISIS SAQUE</button></nav><div class="setbox"><select id="setSelect"><option>SET 1</option><option>SET 2</option><option>SET 3</option><option>SET 4</option><option>SET 5</option></select><button class="icon" id="newMatch">↻</button></div></div></header>
<main class="wrap">
<section id="reg" class="screen active">
<div class="newmatch"><input id="matchName" placeholder="Nombre del partido (opcional)"><button id="saveMatch">GUARDAR PARTIDO</button></div>
<div class="panel servePanel"><h2>SAQUE</h2><div id="serveRoster" class="roster"></div></div>
<div class="panel recPanel"><h2>RECEPCIÓN</h2><div id="recRoster" class="roster recRoster"></div></div>
<div class="panel"><h2>VALORACIÓN</h2><div class="valuation"><button class="val v-eq" data-val="=">=</button><button class="val v-sl" data-val="/">/</button><button class="val v-dash" data-val="−">−</button><button class="val v-bang" data-val="!">!</button><button class="val v-plus" data-val="+">+</button><button class="val v-hash" data-val="#">#</button></div>
<div class="actions"><button class="quick" id="quick">ACCIÓN RÁPIDA</button><button class="undo" id="undo">DESHACER ÚLTIMA ACCIÓN</button></div>
<div id="current" class="current">Selecciona saque → zona → recepción → zona → valoración</div>
<div class="counter"><div class="box"><b id="cServe">0</b><span>SAQUES</span></div><div class="box"><b id="cRec">0</b><span>RECEPCIONES</span></div><div class="box"><b id="cErr">0</b><span>ERRORES DE SAQUE</span></div></div></div>
</section>
<section id="rec" class="screen analysis"><h1>ANÁLISIS DE RECEPCIÓN</h1><div id="recTop"></div><div class="sectionTitle">RESUMEN - RECEPCIÓN (POR ZONA)</div><div id="recZone"></div><div class="sectionTitle">DETALLE POR JUGADORA - RECEPCIÓN</div><div id="recDetails"></div></section>
<section id="srv" class="screen analysis"><h1>ANÁLISIS DE SAQUE</h1><div id="srvTop"></div><div class="sectionTitle">RESUMEN - SAQUE POR ZONA</div><div id="srvZone"></div><div class="sectionTitle">DETALLE POR JUGADORA - SAQUE</div><div id="srvDetails"></div></section>
</main></div>
<script>
const REC_N=10,SERV_N=14;const vals=['=','/','−','!','+','#'];
const namesRec=['VANESSA','ESTELA','JUGADORA 3','JUGADORA 4','JUGADORA 5','JUGADORA 6','JUGADORA 7','JUGADORA 8','JUGADORA 9','JUGADORA 10'];
const namesSrv=['VANESSA','ESTELA','JUGADORA 3','JUGADORA 4','JUGADORA 5','JUGADORA 6','JUGADORA 7','JUGADORA 8','JUGADORA 9','JUGADORA 10','JUGADORA 11','JUGADORA 12','JUGADORA 13','JUGADORA 14'];
let data=JSON.parse(localStorage.getItem('volleystat_final')||'null')||{sets:{}};let currentSet=1;let state={server:null,sz:null,receiver:null,rz:null};
function setData(){let k='set'+currentSet;if(!data.sets[k])data.sets[k]={events:[],recNames:[...namesRec],srvNames:[...namesSrv]};return data.sets[k]}
function save(){localStorage.setItem('volleystat_final',JSON.stringify(data))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderRosters(){const d=setData();document.getElementById('serveRoster').innerHTML=d.srvNames.map((n,i)=>card(n,i,'srv')).join('');document.getElementById('recRoster').innerHTML=d.recNames.map((n,i)=>card(n,i,'rec')).join('');document.querySelectorAll('.player input').forEach(x=>x.onchange=rename);document.querySelectorAll('.zones button').forEach(b=>b.onclick=zoneClick)}
function card(n,i,type){const selected=(type==='srv'&&state.server===i)||(type==='rec'&&state.receiver===i);const count=type==='rec'?setData().events.filter(e=>e.receiver===i).length:'';return `<div class="player ${selected?'selected':''}" data-type="${type}" data-i="${i}"><div class="playerHead"><input value="${esc(n)}" aria-label="Nombre"><span class="count">${count}</span></div><div class="zones">${[1,6,5].map(z=>`<button data-zone="${z}" class="${(type==='srv'?state.sz:state.rz)===z&&selected?'sel':''}">${z}</button>`).join('')}</div></div>`}
function rename(e){const d=setData(),p=e.target.closest('.player'),i=+p.dataset.i;if(p.dataset.type==='srv')d.srvNames[i]=e.target.value||('JUGADORA '+(i+1));else d.recNames[i]=e.target.value||('JUGADORA '+(i+1));save();renderRosters();renderAll()}
function zoneClick(e){const p=e.target.closest('.player'),i=+p.dataset.i,z=+e.target.dataset.zone;if(p.dataset.type==='srv'){state.server=i;state.sz=z}else{if(state.server===null)return alert('Selecciona primero la jugadora de saque.');state.receiver=i;state.rz=z}renderRosters();updateCurrent()}
function updateCurrent(val){const d=setData();let s=state.server!==null?'SQ '+d.srvNames[state.server]:'SQ';if(state.sz)s+=' Z'+state.sz;if(state.receiver!==null){s+=' . '+d.recNames[state.receiver];if(state.rz)s+=' Z'+state.rz}if(val)s+=' '+val;document.getElementById('current').textContent=s}
function addEvent(v){const d=setData();if(state.server===null||!state.sz)return alert('Selecciona jugadora y zona de saque.');if(v==='='){d.events.push({server:state.server,sz:state.sz,serve:'=',receiver:null,rz:null,rv:null});state={server:null,sz:null,receiver:null,rz:null};save();renderAll();return}if(state.receiver===null||!state.rz)return alert('Selecciona jugadora y zona de recepción.');d.events.push({server:state.server,sz:state.sz,serve:serveFromReception(v),receiver:state.receiver,rz:state.rz,rv:v});state={server:null,sz:null,receiver:null,rz:null};save();renderAll()}
function serveFromReception(rv){if(rv==='/')return '/';if(rv==='!')return '!';if(rv==='+'||rv==='#')return '−';if(rv==='=')return '#';if(rv==='−')return '+';return '−'}
document.querySelectorAll('.val').forEach(b=>b.onclick=()=>addEvent(b.dataset.val));
document.getElementById('undo').onclick=()=>{const d=setData();if(state.rz!==null){state.rz=null;state.receiver=null}else if(state.receiver!==null){state.receiver=null}else if(state.sz!==null){state.sz=null;state.server=null}else if(state.server!==null){state.server=null}else if(d.events.length){d.events.pop();save()}renderAll()};
document.getElementById('quick').onclick=()=>{const d=setData();if(state.server===null)return alert('Selecciona primero el saque.');if(state.receiver!==null&&state.rz){addEvent('#')}else alert('Acción rápida: completa recepción y zona para registrar #.')};
document.getElementById('setSelect').onchange=e=>{currentSet=+e.target.value.replace('SET ','');state={server:null,sz:null,receiver:null,rz:null};renderAll()};
document.getElementById('newMatch').onclick=()=>{if(confirm('¿Crear un partido nuevo? Se borrarán los datos actuales de VolleyStat en este dispositivo.')){localStorage.removeItem('volleystat_final');data={sets:{}};currentSet=1;state={server:null,sz:null,receiver:null,rz:null};document.getElementById('matchName').value='';renderAll()}};
document.getElementById('saveMatch').onclick=()=>{save();alert('Partido guardado en este iPad.');};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.screen).classList.add('active');renderAll()});
function pct(n,t){return t?Math.round(n/t*1000)/10:0}function eff(pos,err,t){return t?Math.round((pos-err)/t*1000)/10:0}function count(arr,k){return arr.filter(x=>x===k).length}
function recStats(i){const ev=setData().events.filter(e=>e.receiver===i&&e.rv);const c=Object.fromEntries(vals.map(v=>[v,0]));ev.forEach(e=>c[e.rv]++);const t=ev.length,err=c['=']+c['/'],pos=c['+']+c['#'];return{c,t,err,pos,neu:c['−']+c['!'],eff:eff(pos,err,t)}}
function serveStats(i){const ev=setData().events.filter(e=>e.server===i);const c=Object.fromEntries(vals.map(v=>[v,0]));ev.forEach(e=>c[e.serve]++);const t=ev.length,err=c['='],pos=c['/']+c['#'];return{c,t,err,pos,neu:c['−']+c['!']+c['+'],eff:eff(pos,err,t)}}
function table(html){return `<div class="tablewrap"><table class="tbl">${html}</table></div>`}
function renderRec(){const d=setData();let h='<thead><tr><th>#</th><th>Jugadora</th><th>Eficiencia</th><th>Tot</th>';vals.forEach(v=>h+=`<th>${v}</th><th>%</th>`);h+='</tr></thead><tbody>';d.recNames.forEach((n,i)=>{const s=recStats(i);h+=`<tr><td>${i+1}</td><td>${esc(n)}</td><td>${s.eff}%</td><td>${s.t}</td>`;vals.forEach(v=>h+=`<td>${s.c[v]}</td><td>${pct(s.c[v],s.t)}%</td>`);h+='</tr>'});h+='</tbody>';document.getElementById('recTop').innerHTML=table(h);
let z='<thead><tr><th>#</th><th>Jugadora</th><th>Eficiencia</th><th>Total</th><th colspan="6">Errores (= /)</th><th colspan="6">Neutro (− !)</th><th colspan="6">Aciertos (+ #)</th></tr><tr><th></th><th></th><th></th><th></th>';['Z5','Z6','Z1'].forEach(()=>z+='<th>Z5</th><th>%</th><th>Z6</th><th>%</th><th>Z1</th><th>%</th>');z+='</tr></thead><tbody>';d.recNames.forEach((n,i)=>{const ev=d.events.filter(e=>e.receiver===i&&e.rv);const zones=[5,6,1];const total=ev.length;const rs=recStats(i);z+=`<tr><td>${i+1}</td><td>${esc(n)}</td><td>${rs.eff}%</td><td>${total}</td>`;[["=","/"],["−","!"],["+","#"]].forEach(g=>zones.forEach(zz=>{const a=ev.filter(e=>e.rz===zz&&g.includes(e.rv)).length;const tz=ev.filter(e=>e.rz===zz).length;z+=`<td>${a}</td><td>${pct(a,tz)}%</td>`}));z+='</tr>'});z+='</tbody>';document.getElementById('recZone').innerHTML=table(z);
let det='';d.recNames.forEach((n,i)=>{const ev=d.events.filter(e=>e.receiver===i&&e.rv);let q=`<div class="detail"><div class="detailHead"><span>${i+1}. ${esc(n)}</span><small>Total Recepciones: ${ev.length} · Eficiencia: ${recStats(i).eff}%</small></div>`;let t='<thead><tr><th>Zona</th><th>Errores N°</th><th>%</th><th>Neutro N°</th><th>%</th><th>Aciertos N°</th><th>%</th></tr></thead><tbody>';[5,6,1].forEach(zv=>{const a=ev.filter(e=>e.rz===zv);const er=a.filter(e=>['=','/'].includes(e.rv)).length;const ne=a.filter(e=>['−','!'].includes(e.rv)).length;const ac=a.filter(e=>['+','#'].includes(e.rv)).length;t+=`<tr><td>Z${zv}</td><td>${er}</td><td>${pct(er,a.length)}%</td><td>${ne}</td><td>${pct(ne,a.length)}%</td><td>${ac}</td><td>${pct(ac,a.length)}%</td></tr>`});const er=ev.filter(e=>['=','/'].includes(e.rv)).length,ne=ev.filter(e=>['−','!'].includes(e.rv)).length,ac=ev.filter(e=>['+','#'].includes(e.rv)).length;t+=`<tr><th>TOTAL</th><th>${er}</th><th>${pct(er,ev.length)}%</th><th>${ne}</th><th>${pct(ne,ev.length)}%</th><th>${ac}</th><th>${pct(ac,ev.length)}%</th></tr></tbody>`;q+=table(t)+'</div>';det+=q});document.getElementById('recDetails').innerHTML=det}
function renderSrv(){const d=setData();let h='<thead><tr><th>#</th><th>Jugadora</th><th>Eficiencia</th><th>Tot</th>';vals.forEach(v=>h+=`<th>${v}</th><th>%</th>`);h+='</tr></thead><tbody>';d.srvNames.forEach((n,i)=>{const s=serveStats(i);h+=`<tr><td>${i+1}</td><td>${esc(n)}</td><td>${s.eff}%</td><td>${s.t}</td>`;vals.forEach(v=>h+=`<td>${s.c[v]}</td><td>${pct(s.c[v],s.t)}%</td>`);h+='</tr>'});h+='</tbody>';document.getElementById('srvTop').innerHTML=table(h);
let z='<thead><tr><th>Zona</th><th colspan="2">Total</th><th colspan="2">E.S. (=)</th><th colspan="2">Neutro (− ! +)</th><th colspan="2">Aciertos (/ #)</th></tr></thead><tbody>';[5,6,1].forEach(zz=>{const ev=d.events.filter(e=>e.sz===zz),es=ev.filter(e=>e.serve==='=').length,ne=ev.filter(e=>['−','!','+'].includes(e.serve)).length,ac=ev.filter(e=>['/','#'].includes(e.serve)).length;z+=`<tr><th>Z${zz}</th><td>${ev.length}</td><td>100%</td><td>${es}</td><td>${pct(es,ev.length)}%</td><td>${ne}</td><td>${pct(ne,ev.length)}%</td><td>${ac}</td><td>${pct(ac,ev.length)}%</td></tr>`});const all=d.events,es=all.filter(e=>e.serve==='=').length,ne=all.filter(e=>['−','!','+'].includes(e.serve)).length,ac=all.filter(e=>['/','#'].includes(e.serve)).length;z+=`<tr><th>TOTAL</th><th>${all.length}</th><th>100%</th><th>${es}</th><th>${pct(es,all.length)}%</th><th>${ne}</th><th>${pct(ne,all.length)}%</th><th>${ac}</th><th>${pct(ac,all.length)}%</th></tr></tbody>`;document.getElementById('srvZone').innerHTML=table(z);
let det='';d.srvNames.forEach((n,i)=>{const ev=d.events.filter(e=>e.server===i),s=serveStats(i);let q=`<div class="detail"><div class="detailHead"><span>${i+1}. ${esc(n)}</span><small>Total saques: ${s.t} · Eficiencia: ${s.eff}%</small></div>`;let t='<thead><tr><th>Zona</th><th>E.S. N°</th><th>%</th><th>Neutro N°</th><th>%</th><th>Aciertos N°</th><th>%</th></tr></thead><tbody>';[5,6,1].forEach(zv=>{const a=ev.filter(e=>e.sz===zv),es=a.filter(e=>e.serve==='=').length,ne=a.filter(e=>['−','!','+'].includes(e.serve)).length,ac=a.filter(e=>['/','#'].includes(e.serve)).length;t+=`<tr><td>Z${zv}</td><td>${es}</td><td>${pct(es,a.length)}%</td><td>${ne}</td><td>${pct(ne,a.length)}%</td><td>${ac}</td><td>${pct(ac,a.length)}%</td></tr>`});const es2=ev.filter(e=>e.serve==='=').length,ne2=ev.filter(e=>['−','!','+'].includes(e.serve)).length,ac2=ev.filter(e=>['/','#'].includes(e.serve)).length;t+=`<tr><th>TOTAL</th><th>${es2}</th><th>${pct(es2,ev.length)}%</th><th>${ne2}</th><th>${pct(ne2,ev.length)}%</th><th>${ac2}</th><th>${pct(ac2,ev.length)}%</th></tr></tbody>`;q+=table(t)+'</div>';det+=q});document.getElementById('srvDetails').innerHTML=det}
function renderAll(){setData();renderRosters();updateCurrent();const d=setData();document.getElementById('cServe').textContent=d.events.length;document.getElementById('cRec').textContent=d.events.filter(e=>e.receiver!==null).length;document.getElementById('cErr').textContent=d.events.filter(e=>e.serve==='=').length;renderRec();renderSrv()}
renderAll();
</script></body></html>
