<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>VolleyStat iPad</title>
<style>
:root{--bg:#07111e;--panel:#102239;--line:#2b4058;--text:#eef5ff;--muted:#9db0c6;--green:#38d6a4;--red:#ef5961;--orange:#f0a53a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}button{cursor:pointer;border:0;color:var(--text)}
header{position:sticky;top:0;z-index:20;background:#0b1726;border-bottom:1px solid var(--line);padding:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-size:19px;font-weight:800;margin-right:auto}.teamBtns{display:flex;gap:8px}.teamBtns button{padding:10px 14px;border-radius:10px;background:#172d47;font-weight:800}.teamBtns .active{background:var(--green);color:#062018}.reset{background:var(--red)!important}
nav{display:flex;background:#0b1726;border-bottom:1px solid var(--line);overflow:auto;position:sticky;top:59px;z-index:19}
nav button{flex:1;min-width:145px;padding:14px 12px;background:transparent;border-right:1px solid var(--line);font-weight:800;color:#9eb1c7}
nav button.active{background:#18314f;color:white}
main{padding:14px;max-width:1500px;margin:auto}.screen{display:none}.screen.active{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.setup{display:grid;grid-template-columns:1fr 1fr;gap:12px}.setup label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}
.setup input,.player input{width:100%;padding:10px;border-radius:9px;border:1px solid var(--line);background:#091725;color:white}
.toolbar,.skillTabs{display:flex;gap:8px;flex-wrap:wrap}.toolbar button,.small,.skillTabs button{padding:9px 12px;border-radius:9px;background:#203954;font-weight:700}
.primary,.skillTabs .active{background:var(--green)!important;color:#062018!important}.skillTabs{overflow:auto;margin-bottom:12px}.skillTabs button{white-space:nowrap}
.statHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.statHead h2{margin:0}
.playerGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.player{display:flex;align-items:center;gap:8px;background:#0b1b2d;border:1px solid var(--line);border-radius:10px;padding:8px}.player input{flex:1;min-width:0}.num{font-weight:900;width:28px;text-align:center;color:var(--green)}
.selectedPlayer{background:#17314e;border:1px solid #3c6287;padding:10px;border-radius:10px;margin-bottom:10px}.selectedPlayer strong{color:var(--green)}
.outcomes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.outcome{min-height:72px;border-radius:12px;border:1px solid var(--line);background:#142b43;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:900}.outcome b{font-size:23px}.step{display:flex;gap:5px;margin-top:3px}.step button{padding:5px 9px;border-radius:7px;background:#203954;font-weight:900}.step button:first-child{background:#38d6a4;color:#062018}.outcome small{font-size:11px;color:var(--muted)}.outcome.err{background:#5a2028}.outcome.pos{background:#124f42}
.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.statsTable{width:100%;border-collapse:collapse;min-width:900px}.statsTable th,.statsTable td{padding:8px;border-bottom:1px solid var(--line);text-align:center}.statsTable th{background:#152c46}.statsTable td:first-child,.statsTable th:first-child{text-align:left}.team{background:#17314a;font-weight:900}
.green{color:var(--green)}.red{color:#ff737a}.orange{color:#ffc15b}.muted{color:var(--muted)}
.chartGrid,.playerCards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.playerCards{grid-template-columns:repeat(2,1fr)}
.metricCard{background:#0d1d2f;border:1px solid var(--line);border-radius:12px;padding:12px}.metricCard h3{margin:0 0 10px}
.bar{height:24px;background:#07111e;border-radius:8px;overflow:hidden;margin:6px 0 12px}.fill{height:100%;display:flex;align-items:center;justify-content:flex-end;padding-right:7px;font-size:12px;font-weight:900}.ef{background:#dfe7ef;color:#182333}.pos{background:#2ed39d;color:#062018}.err{background:#ed5b62;color:white}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}.side{border-radius:14px;padding:14px;background:#102239;border:1px solid var(--line)}.side.rival{border-color:#5a4650}
@media(max-width:800px){.setup,.playerGrid,.playerCards,.compare{grid-template-columns:1fr}.chartGrid{grid-template-columns:1fr}.outcome{min-height:64px}.brand{width:100%;margin:0}.teamBtns{width:100%}.teamBtns button{flex:1}}
</style>
</head>
<body>
<header><div class="brand">🏐 VolleyStat</div><div class="teamBtns">
<button id="myBtn" class="active" onclick="setTeam('my')">MI EQUIPO</button>
<button id="rivalBtn" onclick="setTeam('rival')">RIVAL</button>
<button class="reset" onclick="resetAll()">RESET</button>
</div></header>
<nav>
<button class="active" onclick="showScreen('data',this)">DATOS</button>
<button onclick="showScreen('players',this)">GRÁFICOS JUGADORES</button>
<button onclick="showScreen('team',this)">GRÁFICO EQUIPO</button>
<button onclick="showScreen('compare',this)">COMPARAR</button>
</nav>
<main>
<section id="data" class="screen active">
<div class="card"><div class="setup">
<div><label>NOMBRE DEL EQUIPO</label><input id="teamName" oninput="saveNames()" placeholder="Mi equipo"></div>
<div><label>NOMBRE DEL RIVAL</label><input id="rivalName" oninput="saveNames()" placeholder="Rival"></div>
</div></div>
<div class="card"><div class="statHead"><h2>Jugadores — <span id="activeTeamLabel"></span></h2><button class="small primary" onclick="addPlayer()">＋ AÑADIR JUGADOR</button></div><div id="playersList" class="playerGrid"></div></div>
<div class="card"><div class="skillTabs" id="skillTabs"></div><div id="selectedPlayer" class="selectedPlayer"></div><div id="outcomes" class="outcomes"></div>
<p class="muted">Botones de registro: = error directo · - y + neutras · / y # positivas. Las fórmulas se aplican según el fundamento.</p></div>
<div class="card"><h2>Resumen del equipo</h2><div id="teamTable"></div></div>
</section>
<section id="players" class="screen"><div class="card"><h2>Gráficos jugadores</h2><div id="playerCharts" class="playerCards"></div></div></section>
<section id="team" class="screen"><div class="card"><h2>Gráfico equipo — <span id="teamChartTitle"></span></h2><div id="teamCharts" class="chartGrid"></div></div></section>
<section id="compare" class="screen"><div class="card"><h2>Comparación</h2><div id="compareBox" class="compare"></div></div></section>
</main>
<script>
const skills=['Saque','Recepción','Ataque','Bloqueo','Defensa'];
const outcomes=[['=','Error directo','err'],['-','Negativa',''],['+','Positiva simple',''],['/','Positiva útil','pos'],['#','Positiva doble','pos']];
let state=JSON.parse(localStorage.getItem('volleystat_ipad')||'null')||{team:'my',selected:0,skill:'Saque',names:{my:'Mi equipo',rival:'Rival'},players:{my:[],rival:[]}};
function blankPlayer(i){let stats={};skills.forEach(k=>stats[k]={'=':0,'/':0,'-':0,'!':0,'+':0,'#':0});return{name:'JUGADOR '+(i+1),stats}}
function ensure(){['my','rival'].forEach(t=>{if(!state.players[t])state.players[t]=[];if(!state.players[t].length)state.players[t].push(blankPlayer(0));});if(state.selected<0||state.selected>=state.players[state.team].length)state.selected=0}
function save(){localStorage.setItem('volleystat_ipad',JSON.stringify(state));render()}
function setTeam(t){state.team=t;state.selected=0;save()}
function saveNames(){state.names.my=document.getElementById('teamName').value||'Mi equipo';state.names.rival=document.getElementById('rivalName').value||'Rival';localStorage.setItem('volleystat_ipad',JSON.stringify(state));renderLabels()}
function addPlayer(){state.players[state.team].push(blankPlayer(state.players[state.team].length));state.selected=state.players[state.team].length-1;save()}
function rename(i,v){state.players[state.team][i].name=v;localStorage.setItem('volleystat_ipad',JSON.stringify(state));renderLabels()}
function selectPlayer(i){state.selected=i;render()}
function record(sym,delta){let v=state.players[state.team][state.selected].stats[state.skill][sym];state.players[state.team][state.selected].stats[state.skill][sym]=Math.max(0,v+delta);save()}
function resetAll(){if(confirm('¿RESET? Se borrarán las estadísticas de ambos equipos.')){state={team:'my',selected:0,skill:'Saque',names:{my:'Mi equipo',rival:'Rival'},players:{my:[],rival:[]}};ensure();save()}}
function showScreen(id,btn){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render()}
function calc(p,k){let s=p.stats[k],total=Object.values(s).reduce((a,b)=>a+b,0),pos=0,err=0;if(k==='Saque'){pos=s['!']+s['#'];err=s['='];}else if(k==='Recepción'){pos=s['+']+s['#'];err=s['=']+s['/'];}else if(k==='Ataque'){pos=s['#'];err=s['=']+s['/'];}else{pos=s['#'];err=s['='];}let ef=total?(pos-err)/total*100:0;return{ s,total,pos,err,ef,posPct:total?pos/total*100:0,errPct:total?err/total*100:0}}
function agg(t,k){let a={'=':0,'/':0,'-':0,'!':0,'+':0,'#':0};state.players[t].forEach(p=>Object.keys(a).forEach(x=>a[x]+=p.stats[k][x]));return calc({stats:{[k]:a}},k)}
function renderLabels(){document.getElementById('teamName').value=state.names.my;document.getElementById('rivalName').value=state.names.rival;document.getElementById('activeTeamLabel').textContent=state.names[state.team];document.getElementById('teamChartTitle').textContent=state.names[state.team];document.getElementById('myBtn').classList.toggle('active',state.team==='my');document.getElementById('rivalBtn').classList.toggle('active',state.team==='rival')}
function render(){ensure();renderLabels();renderPlayers();renderSkills();renderTeamTable();renderPlayerCharts();renderTeamCharts();renderCompare()}
function renderPlayers(){let a=state.players[state.team];document.getElementById('playersList').innerHTML=a.map((p,i)=>`<div class="player" onclick="selectPlayer(${i})"><span class="num">${i+1}</span><input value="${esc(p.name)}" onclick="event.stopPropagation();selectPlayer(${i})" onchange="rename(${i},this.value)"><button class="small ${i===state.selected?'primary':''}" onclick="event.stopPropagation();selectPlayer(${i})">${i===state.selected?'ACTIVO':'ELEGIR'}</button></div>`).join('')}
function renderSkills(){document.getElementById('skillTabs').innerHTML=skills.map(k=>`<button class="${k===state.skill?'active':''}" onclick="state.skill='${k}';render()">${k}</button>`).join('');let p=state.players[state.team][state.selected];document.getElementById('selectedPlayer').innerHTML=`Jugador activo: <strong>${esc(p.name)}</strong> · ${state.names[state.team]}`;document.getElementById('outcomes').innerHTML=outcomes.map(([s,l,c])=>`<div class="outcome ${c}"><b>${s}</b><small>${l}</small><strong>${p.stats[state.skill][s]}</strong><span class="step"><button onclick="record('${s}',1)">＋</button><button onclick="record('${s}',-1)">−</button></span></div>`).join('')}
function renderTeamTable(){let rows=skills.map(k=>{let c=agg(state.team,k);return`<tr><td>${k}</td><td>${c.total}</td><td class="orange">${c.ef.toFixed(0)}%</td><td class="green">${c.posPct.toFixed(0)}%</td><td class="red">${c.errPct.toFixed(0)}%</td><td>${c.s['=']}</td><td>${c.s['/']}</td><td>${c.s['-']}</td><td>${c.s['!']}</td><td>${c.s['+']}</td><td>${c.s['#']}</td></tr>`}).join('');let total=skills.reduce((n,k)=>n+agg(state.team,k).total,0);document.getElementById('teamTable').innerHTML=`<div class="tableWrap"><table class="statsTable"><tr><th>Fundamento</th><th>T</th><th>EFI</th><th>POS</th><th>ERR</th><th>=</th><th>/</th><th>-</th><th>!</th><th>+</th><th>#</th></tr>${rows}<tr class="team"><td>TOTAL EQUIPO</td><td>${total}</td><td colspan="8">Totales de todos los jugadores</td></tr></table></div>`}
function renderPlayerCharts(){let a=state.players[state.team].filter(p=>Object.values(p.stats).some(k=>Object.values(k).some(v=>v)));if(!a.length)a=state.players[state.team].slice(0,1);document.getElementById('playerCharts').innerHTML=a.map(p=>{let c=calc(p,state.skill);return`<div class="metricCard"><h3>${esc(p.name)}</h3><div>EFI <b>${c.ef.toFixed(0)}%</b></div><div class="bar"><div class="fill ef" style="width:${clamp(c.ef)}%">${c.ef.toFixed(0)}%</div></div><div>Pos % <b>${c.posPct.toFixed(0)}%</b></div><div class="bar"><div class="fill pos" style="width:${clamp(c.posPct)}%">${c.posPct.toFixed(0)}%</div></div><div>Err <b>${c.errPct.toFixed(0)}%</b></div><div class="bar"><div class="fill err" style="width:${clamp(c.errPct)}%">${c.errPct.toFixed(0)}%</div></div><small class="muted">T=${c.total} · =${c.s['=']} · -=${c.s['-']} · +=${c.s['+']} · /=${c.s['/']} · #=${c.s['#']}</small></div>`}).join('')}
function renderTeamCharts(){document.getElementById('teamCharts').innerHTML=skills.map(k=>{let c=agg(state.team,k);return`<div class="metricCard"><h3>${k}</h3><div>EFI <b>${c.ef.toFixed(0)}%</b></div><div class="bar"><div class="fill ef" style="width:${clamp(c.ef)}%">${c.ef.toFixed(0)}%</div></div><div>Pos % <b>${c.posPct.toFixed(0)}%</b></div><div class="bar"><div class="fill pos" style="width:${clamp(c.posPct)}%">${c.posPct.toFixed(0)}%</div></div><div>Err <b>${c.errPct.toFixed(0)}%</b></div><div class="bar"><div class="fill err" style="width:${clamp(c.errPct)}%">${c.errPct.toFixed(0)}%</div></div><small class="muted">T=${c.total} · =${c.s['=']} · -=${c.s['-']} · +=${c.s['+']} · /=${c.s['/']} · #=${c.s['#']}</small></div>`}).join('')}
function renderCompare(){document.getElementById('compareBox').innerHTML=[['my',state.names.my],['rival',state.names.rival]].map(([t,n])=>`<div class="side ${t==='rival'?'rival':''}"><h2>${esc(n)}</h2>${skills.map(k=>{let c=agg(t,k);return`<div><b>${k}</b><br>Ef <span class="orange">${c.ef.toFixed(0)}%</span> · Pos <span class="green">${c.posPct.toFixed(0)}%</span> · Err <span class="red">${c.errPct.toFixed(0)}%</span> · T ${c.total}</div>`}).join('<hr style="border:0;border-top:1px solid #2b4058;margin:10px 0">')}</div>`).join('')}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function clamp(x){return Math.max(0,Math.min(100,x))}
ensure();render();
</script>
</body></html>
