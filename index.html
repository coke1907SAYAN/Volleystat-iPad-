<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>VolleyStat</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f5f7;color:#111827}header{height:64px;background:#111827;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:800}.logo{font-size:20px}.actions{display:flex;gap:8px}.topbtn{border:0;padding:10px 14px;border-radius:10px;background:#374151;color:white;font-weight:800;touch-action:manipulation}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;background:white;position:sticky;top:0;z-index:5}.tab{border:0;padding:13px;border-radius:12px;background:#e5e7eb;font-weight:900;font-size:17px;touch-action:manipulation}.tab.active{background:#111827;color:white}main{padding:0 10px 28px;max-width:900px;margin:auto}.esbar{display:flex;justify-content:center;align-items:center;gap:10px;padding:12px 10px}.es{width:58px;height:58px;border:0;border-radius:50%;background:#ef4444;color:white;font-weight:900;font-size:15px;touch-action:manipulation}.esc{font-size:20px;font-weight:900;min-width:30px}.players{display:flex;flex-direction:column;gap:7px}.row{display:grid;grid-template-columns:minmax(105px,1fr) repeat(6,52px);gap:5px;align-items:center;background:white;padding:6px;border-radius:12px}.name{min-width:0;height:52px;border:1px solid #d1d5db;border-radius:9px;padding:0 8px;font-weight:800;font-size:14px;background:#fff}.vbtn{height:52px;border:0;border-radius:9px;position:relative;font-size:25px;font-weight:900;box-shadow:0 1px 2px #0002;touch-action:manipulation}.vbtn b{position:absolute;right:5px;bottom:2px;font-size:11px;line-height:1}.v0{background:#ef4444;color:#fff}.v1,.v2,.v3{background:#f59e0b;color:#111}.v4{background:#86efac;color:#111}.v5{background:#22c55e;color:#fff}.stats{margin-top:18px;background:white;border-radius:14px;overflow:hidden}.stats h2{margin:0;padding:13px;font-size:16px;background:#e5e7eb}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 5px;text-align:center;border-bottom:1px solid #e5e7eb}th:first-child,td:first-child{text-align:left;padding-left:9px}th{font-weight:900}.team td{font-weight:900;background:#f3f4f6}@media(max-width:650px){.row{grid-template-columns:minmax(86px,1fr) repeat(6,43px);gap:4px}.vbtn,.name{height:48px}.vbtn{font-size:22px}.name{font-size:12px}}</style></head><body><header><div class="logo">VolleyStat</div><div class="actions"><button class="topbtn" onclick="saveData()">GUARDAR</button><button class="topbtn" onclick="resetData()">RESET</button></div></header><div class="tabs"><button id="tabRec" class="tab active" onclick="setFund('rec')">RECEPCIÓN</button><button id="tabAtq" class="tab" onclick="setFund('atq')">ATAQUE</button></div><main><div class="esbar"><button class="es" onclick="errorSaque()">E.S.</button><span>Error de saque</span><span id="esCount" class="esc">0</span></div><section id="players" class="players"></section><section class="stats"><h2 id="statsTitle">ESTADÍSTICAS — RECEPCIÓN</h2><table><thead><tr><th>JUGADORA</th><th>TOTAL</th><th id="metricHead">EFICIENCIA</th><th>POSITIVO</th><th>NEGATIVO</th></tr></thead><tbody id="statsBody"></tbody></table></section></main><script>const symbols=["=","−","/","!","+","#"],colors=["v0","v1","v2","v3","v4","v5"];let fund="rec";let S=load();function blankPlayer(){return{name:"",v:[0,0,0,0,0,0]}}function initial(){return{players:Array.from({length:14},blankPlayer),es:0}}function load(){try{const x=JSON.parse(localStorage.getItem("volleystat_zero"));if(x&&Array.isArray(x.players))return x}catch(e){}return initial()}function saveData(){localStorage.setItem("volleystat_zero",JSON.stringify(S));alert("Datos guardados.")}function resetData(){if(confirm("¿Quieres borrar todos los datos?")){S=initial();render()}}function setFund(f){fund=f;document.getElementById("tabRec").classList.toggle("active",f==="rec");document.getElementById("tabAtq").classList.toggle("active",f==="atq");render()}function add(i,k){S.players[i].v[k]++;render()}function errorSaque(){S.es++;document.getElementById("esCount").textContent=S.es}function stats(p){const total=p.v.reduce((a,b)=>a+b,0);let pos,neg;if(fund==="rec"){pos=p.v[4]+p.v[5];neg=p.v[0]+p.v[2]}else{pos=p.v[5];neg=p.v[0]+p.v[2]}const value=(fund==="rec"?(pos-neg)/total*100:pos/total*100)||0;return{total,pos,neg,value}}function render(){const wrap=document.getElementById("players");wrap.innerHTML="";S.players.forEach((p,i)=>{const row=document.createElement("div");row.className="row";const name=document.createElement("input");name.className="name";name.placeholder=`Jugadora ${i+1}`;name.value=p.name;name.oninput=()=>S.players[i].name=name.value;row.appendChild(name);symbols.forEach((s,k)=>{const b=document.createElement("button");b.className=`vbtn ${colors[k]}`;b.innerHTML=`${s}<b>${p.v[k]}</b>`;b.onclick=()=>add(i,k);row.appendChild(b)});wrap.appendChild(row)});document.getElementById("statsTitle").textContent=`ESTADÍSTICAS — ${fund==="rec"?"RECEPCIÓN":"ATAQUE"}`;document.getElementById("metricHead").textContent=fund==="rec"?"EFICIENCIA":"EFICACIA";const body=document.getElementById("statsBody");body.innerHTML="";let total=0,pos=0,neg=0;S.players.forEach(p=>{const st=stats(p);total+=st.total;pos+=st.pos;neg+=st.neg;const tr=document.createElement("tr");tr.innerHTML=`<td>${p.name||"—"}</td><td>${st.total}</td><td>${st.value.toFixed(1)}%</td><td>${st.pos}</td><td>${st.neg}</td>`;body.appendChild(tr)});const team=total?((fund==="rec"?(pos-neg):pos)/total*100):0;const tr=document.createElement("tr");tr.className="team";tr.innerHTML=`<td>TOTAL DEL EQUIPO</td><td>${total}</td><td>${team.toFixed(1)}%</td><td>${pos}</td><td>${neg}</td>`;body.appendChild(tr);document.getElementById("esCount").textContent=S.es}render();</script></body></html>
